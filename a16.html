<!DOCTYPE html>
<html lang="en">
<head>
    <title>Select, Textarea and Buttons</title>
</head>
<body>

    <form>
        Course:
        <select>
            <option>ECE</option>
            <option>CSE</option>
            <option>IT</option>
        </select><br><br>

        Feedback:<br>
        <textarea rows="5" cols="45" placeholder="Write here..."></textarea><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button">Click Me</button>
    </form>

</body>
</html>
