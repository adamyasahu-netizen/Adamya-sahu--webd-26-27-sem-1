<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form Input Elements</title>
</head>
<body>

    <form>
        <fieldset>
            <legend>Personal Details</legend>

            <label>Name: <input type="text"></label><br><br>

            <label>Email: <input type="email"></label><br><br>

            <label>Password: <input type="password"></label><br><br>

            Gender:
            <label><input type="radio" name="gender">Male</label>
            <label><input type="radio" name="gender">Female</label><br><br>

            Hobbies:
            <label><input type="checkbox">Reading</label>
            <label><input type="checkbox">Coding</label><br><br>

            <label>DOB: <input type="date"></label>
        </fieldset>
    </form>

</body>
</html>
