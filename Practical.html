<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Designing Practical</title>
</head>
<body>
    <h1><b>Student Spotlight</b></h1>
    <hr>
    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <th>Student</th>
            <th>Family Member</th>
            <th>Sports Celebrity</th>
        </tr>
        <tr>
            <td><img src="Student.jpeg" alt="Student Image" height="360" width="315"></td>
            <td><img src="Family.jpg" alt="Family Member Image" height="360" width="315"></td>
            <td><img src="Sports.jpg" alt="Sports celebrity Image" height="360" width="420"></td>
        </tr>
    </table>
    <h1><b>Embedded Video Gallery</b></h1>
    <hr>
    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <th>Campus Tour</th>
            <th>Sports Highlights</th>
        <tr>
            <td><iframe width="560" height="315" src="https://www.youtube.com/embed/sVdj-z9ekzA" title="ABES Campus Tour" frameborder="0" allowfullscreen></iframe></td>
            <td><iframe width="560" height="315" src="https://www.youtube.com/embed/0up5K8qB8MI" frameborder="0" allowfullscreen></iframe></td>
        </tr>
</body>
</html>
